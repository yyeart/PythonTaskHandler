[project]
name = "labs"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.4.2",
]

[tool.ruff]
extend-exclude = ["tests/conftest.py"]

[[tool.mypy.overrides]]
module = "tests.conftest"
ignore_errors = true

[tool.coverage.run]
source = ["src"]
omit = [
    "src/main.py",
    "src/core/cli.py",
    "src/demonstration.py"
]
